<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JOONS FARM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      overflow: hidden;
    }

    .slideshow::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.42);
      z-index: 1;
    }

    .slideshow img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      animation: fade 42s infinite;
    }

    .slideshow img:nth-child(1) { animation-delay: 0s; }
    .slideshow img:nth-child(2) { animation-delay: 7s; }
    .slideshow img:nth-child(3) { animation-delay: 14s; }
    .slideshow img:nth-child(4) { animation-delay: 21s; }
    .slideshow img:nth-child(5) { animation-delay: 28s; }
    .slideshow img:nth-child(6) { animation-delay: 35s; }

    @keyframes fade {
      0% { opacity: 0; }
      8% { opacity: 1; }
      26% { opacity: 1; }
      34% { opacity: 0; }
      100% { opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 760px;
      padding: 24px;
      text-align: center;
    }

    .logo {
      width: 120px;
      max-width: 34vw;
      margin-bottom: 30px;
      border-radius: 10px;
    }

    h1 {
      font-size: 54px;
      letter-spacing: 6px;
      margin: 0 0 32px;
      font-weight: 700;
    }

    h2 {
      font-size: 28px;
      font-weight: 300;
      margin: 0 0 30px;
      line-height: 1.6;
    }

    p {
      font-size: 21px;
      line-height: 1.9;
      margin: 0;
      font-weight: 300;
    }

    .coming {
      margin-top: 46px;
      font-size: 13px;
      letter-spacing: 5px;
      opacity: 0.88;
    }

    @media (max-width: 768px) {
      .logo {
        width: 95px;
      }

      h1 {
        font-size: 38px;
        letter-spacing: 4px;
      }

      h2 {
        font-size: 21px;
      }

      p {
        font-size: 17px;
      }

      .coming {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="slideshow">
  <img src="sunset.jpg" style="object-position:center center;">
  <img src="fogfarm.jpg" style="object-position:center center;">
  
  <img src="springroad.jpg" style="object-position:center bottom;">
  
  <img src="peony.jpg" style="object-position:center top;">
  
  <img src="sunsetblade.jpg" style="object-position:center center;">
  
  <img src="father.jpg" style="object-position:center top;">
</div>
  <div class="container">
    <img src="logo.png" alt="JOONS FARM logo" class="logo">

    <h1>JOONS FARM</h1>

    <h2>What is growing at JOONS FARM?</h2>

    <p>
      JOONS FARM에서는<br>
      무엇이 자라고 있을까요?
    </p>

    <div class="coming">COMING SOON</div>
  </div>

</body>
</html>
