<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JOONS FARM</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background-image:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url('sunset.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      padding: 24px;
      max-width: 760px;
    }

  .logo {
    width: 130px;
    max-width: 35vw;
    margin-bottom: 20px;
    }  
    
    h1 {
    font-size: 52px;
    letter-spacing: 6px;
    margin: 0 0 34px;
    }

   h2 {
    font-size: 28px;
    font-weight: 300;
    margin: 0 0 32px;
    line-height: 1.7;
    }
    
    p {
      font-size: 21px;
      line-height: 1.8;
      margin: 0;
    }

    .coming {
      margin-top: 46px;
      font-size: 13px;
      letter-spacing: 4px;
      opacity: 0.85;
    }

    @media (max-width: 768px) {
      .logo {
        width: 130px;
      }

      h1 {
        font-size: 38px;
      }

      h2 {
        font-size: 22px;
      }

      p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="logo.png" alt="JOONS FARM logo" class="logo">

    <h1>JOONS FARM</h1>

    <h2>What is growing at JOONS FARM?</h2>

    <p>
      JOONS FARM에서는<br>
      무엇이 자라고 있을까요?
    </p>

    <div class="coming">COMING SOON</div>
  </div>
</body>
</html>
