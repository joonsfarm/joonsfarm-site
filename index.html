<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JOONS FARM</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .slideshow {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .slideshow::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.38);
      z-index: 1;
    }

    .slideshow img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: fade 36s infinite;
    }

    .slideshow img:nth-child(1) {
      animation-delay: 0s;
    }

    .slideshow img:nth-child(2) {
      animation-delay: 6s;
    }

    .slideshow img:nth-child(3) {
      animation-delay: 12s;
    }

    .slideshow img:nth-child(4) {
      animation-delay: 18s;
    }

    .slideshow img:nth-child(5) {
      animation-delay: 24s;
    }

    .slideshow img:nth-child(6) {
      animation-delay: 30s;
    }

    @keyframes fade {
      0% { opacity: 0; }
      8% { opacity: 1; }
      25% { opacity: 1; }
      33% { opacity: 0; }
      100% { opacity: 0; }
    }

    .container {
      padding: 24px;
      max-width: 760px;
      z-index: 2;
    }

    .logo {
      width: 140px;
      max-width: 40vw;
      margin-bottom: 24px;
      border-radius: 12px;
    }

    h1 {
      font-size: 54px;
      letter-spacing: 4px;
      margin: 0 0 24px;
      font-weight: 700;
    }

    h2 {
      font-size: 30px;
      font-weight: 400;
      margin: 0 0 28px;
      line-height: 1.5;
    }

    p {
      font-size: 22px;
      line-height: 1.8;
      margin: 0;
    }

    .coming {
      margin-top: 42px;
      font-size: 15px;
      letter-spacing: 5px;
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      .logo {
        width: 110px;
      }

      h1 {
        font-size: 38px;
      }

      h2 {
        font-size: 22px;
      }

      p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="slideshow">
    <img src="sunset.jpg">
    <img src="fogfarm.jpg">
    <img src="springroad.jpg">
    <img src="peony.jpg">
    <img src="sunsetblade.jpg">
    <img src="father.jpg">
  </div>

  <div class="container">

    <img src="logo.png" alt="JOONS FARM logo" class="logo">

    <h1>JOONS FARM</h1>

    <h2>
      What is growing at JOONS FARM?
    </h2>

    <p>
      JOONS FARM에서는<br>
      무엇이 자라고 있을까요?
    </p>

    <div class="coming">
      COMING SOON
    </div>

  </div>

</body>
</html>
